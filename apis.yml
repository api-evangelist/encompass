  tags:
  - Webhooks
  - Events
  - Subscriptions
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.icemortgagetechnology.com/developer-connect/reference/browse-apis
  baseURL: https://api.elliemae.com
  properties:
  - url: https://developer.icemortgagetechnology.com/developer-connect/reference/browse-apis
    type: APIReference
  - url: openapi/encompass-openapi.yml
    type: OpenAPI
  description: Subscribe to Encompass resource events (loan created / updated / deleted /
    locked / unlocked and more), manage subscriptions, browse available resources and
    their events, query event history, and configure custom authentication for webhook
    delivery. Push-based HTTP callbacks, not a bidirectional WebSocket.
