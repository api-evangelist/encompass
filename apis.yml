aid: encompass
url: https://raw.githubusercontent.com/api-evangelist/encompass/refs/heads/main/apis.yml
name: Encompass
kind: company
description: Encompass is the dominant mortgage loan origination system (LOS), a product
  of ICE Mortgage Technology (formerly Ellie Mae, acquired by Intercontinental Exchange /
  ICE in 2020). Its developer program, Encompass Developer Connect, exposes REST APIs
  that let partners and lenders configure, customize, and administer loan information and
  resources programmatically - loan manufacturing, loan pipeline, borrower pairs,
  contacts, eFolder documents and attachments, milestones, conditions, users, product
  and pricing, and event webhooks. Access is partner/tenant-gated (OAuth 2.0 credentials
  issued per Encompass instance by a super administrator), but the API reference is
  publicly documented at developer.icemortgagetechnology.com.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Mortgage
- Loan Origination
- LOS
- Fintech
- ICE Mortgage Technology
- Ellie Mae
- Lending
created: '2026-07-04'
modified: '2026-07-04'
specificationVersion: '0.19'
apis:
- aid: encompass:encompass-loan-management-api
  name: Encompass Loan Management API
  tags:
  - Loans
  - Loan Data
  - Loan Manufacturing
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.icemortgagetechnology.com/developer-connect/reference/loan-management
  baseURL: https://api.elliemae.com
  properties:
  - url: https://developer.icemortgagetechnology.com/developer-connect/docs/welcome
    type: Documentation
  - url: https://developer.icemortgagetechnology.com/developer-connect/reference/loan-management
    type: APIReference
  - url: openapi/encompass-openapi.yml
    type: OpenAPI
  description: Create, read, update, and delete Encompass loan files and read/write the
    values of loan data fields between applications and Encompass. Includes moving loans
    between folders and retrieving UCD field definitions. Path-based versioning (v3
    current; v1 deprecated).
- aid: encompass:encompass-loan-pipeline-api
  name: Encompass Loan Pipeline API
  tags:
  - Pipeline
  - Search
  - Reporting
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.icemortgagetechnology.com/developer-connect/reference/loan-pipeline
  baseURL: https://api.elliemae.com
  properties:
  - url: https://developer.icemortgagetechnology.com/developer-connect/reference/loan-pipeline
    type: APIReference
  - url: openapi/encompass-openapi.yml
    type: OpenAPI
  description: Search for loans and loan fields across the Encompass pipeline using
    canonical field names, filter criteria, and cursor-based pagination for large result
    sets. Retrieve the list of canonical (queryable) field names.
