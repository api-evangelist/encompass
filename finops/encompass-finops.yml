description: >-
  FinOps view of Encompass Developer Connect spend. Encompass is an enterprise mortgage
  loan origination system from ICE Mortgage Technology (formerly Ellie Mae); API access
  is bundled into the commercial Encompass agreement rather than billed as a public,
  usage-metered API product. There is no self-service per-call price. Cost is therefore
  driven by the underlying Encompass licensing/relationship (typically per-user / per-
  seat and volume-based for loan production) and by ICE Mortgage Technology partner-
  program terms, plus the engineering cost of building and operating integrations. The
  meters below describe the natural business drivers to watch, not published invoice
  line items.
notes: >-
  No public FOCUS-conformant billing feed or per-unit API rate is documented as of the
  review date. Reconcile actual charges against your ICE Mortgage Technology commercial
  agreement. Treat meters as cost-driver signals, not invoiced quantities.
sources:
