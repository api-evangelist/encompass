actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists on Encompass Developer Connect. The API is
    request/response REST over HTTPS at api.elliemae.com with OAuth 2.0, and its
    event mechanism is HTTP-push webhooks rather than a client-held WebSocket or SSE
    stream. No AsyncAPI document was created because there is no server-push transport
    on Encompass's own API to model; the webhook management surface is captured as REST
    in the OpenAPI document. The access model is partner/tenant-gated, so confirmed
    endpoints were read from the public reference and the remainder are honestly
    labeled as modeled from documented path conventions.
