aid: encompass
name: Encompass
review:
  question: Does Encompass expose a documented public WebSocket API?
  answer: false
  date: '2026-07-04'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. Encompass Developer Connect's public event
    mechanism is webhooks - ICE Mortgage Technology POSTs event notifications
    (loan.created, loan.updated, loan.deleted, loan.locked, loan.unlocked, and
    other resource events) to an HTTPS endpoint the subscriber registers. That is
    server-to-endpoint HTTP push, not a client-held WebSocket or SSE stream on
    Encompass's own API, so there is no server-push transport on Encompass's API
    surface to model as AsyncAPI. The webhook subscription/resource/event
    management surface is modeled as REST in the OpenAPI document instead.
findings:
  summary: |
    Encompass does not publish a documented public WebSocket API. Encompass is the
    dominant mortgage loan origination system (LOS), a product of ICE Mortgage
    Technology - formerly Ellie Mae, acquired by Intercontinental Exchange (ICE) in
    2020. Its developer program, Encompass Developer Connect, is a REST API platform
    over HTTPS at host api.elliemae.com (the Ellie Mae lineage is still visible in
    the API host). Access is partner/tenant-gated: every call carries an OAuth 2.0
    bearer token (client_credentials or authorization_code) obtained from
    POST https://api.elliemae.com/oauth2/v1/token, using a Client ID / secret / API
    key that a super-administrator persona provisions in the developer portal per
    Encompass instance. Versioning is path-based (v3 current, v1/v2 deprecated).
    Real-time change notification is delivered via webhooks (HTTP push callbacks),
    not a bidirectional WebSocket. No realtime ws:// or wss:// endpoint is documented
    anywhere in the Developer Connect reference as of the review date.
  gatedReference: |
    The API reference at developer.icemortgagetechnology.com is publicly browsable
    for endpoint listings (categories, paths, methods), but the interactive request
    builder / "try it" and full schema payloads sit behind a developer-portal login,
    and actually calling the APIs requires instance-provisioned OAuth credentials.
    Endpoints marked x-endpoint-status "confirmed" in the OpenAPI were read from the
    public reference (Loan Management, Loan Pipeline, eFolder documents/attachments,
    all Webhooks endpoints, OAuth token). Endpoints marked "modeled" (Borrower Pairs,
    Contacts, Milestones/Associates, Conditions, Users) follow Encompass's documented
    and consistent path conventions but were not read verbatim from a public page and
    should be verified against the live reference before use.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.elliemae.com
      documented: true
      note: All Developer Connect APIs are request/response REST over HTTPS. OAuth 2.0 bearer auth.
    - protocol: Webhook
      scheme: https
      documented: true
      note: Resource events are POSTed to a subscriber-registered HTTPS endpoint. Server-to-endpoint HTTP push, not WebSocket.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented anywhere in the Encompass Developer Connect reference as of the review date.
